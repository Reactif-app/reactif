# cd.yml
name: Google Play Store - Internal Deployment

on:
  push:
    branches:
      - beta-releases

permissions:
  contents: write

jobs:
  # CD
  deploy_android:
    runs-on: macos-latest
    # Beta release only
    if: github.ref == 'refs/heads/beta-releases'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          check-latest: true
          cache: "gradle"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Cache Ruby gems (fastlane)
        uses: actions/cache@v4
        with:
          path: ~/.gem
          key: ${{ runner.os }}-ruby-3.2-fastlane-v2-${{ hashFiles('.github/workflows/cd_android_internal.yml') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.2-fastlane-v2-

      - name: Add Ruby user gem bin to PATH
        run: echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Prepare and validate Google Play service account key (early)
        run: |
          mkdir -p .ci/keys
          RAW_KEY='${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}'

          if [ -z "$RAW_KEY" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is empty or missing"
            exit 1
          fi

          # Try as raw JSON first
          printf '%s' "$RAW_KEY" > .ci/keys/google-play-service-account.json
          if ! jq -e . .ci/keys/google-play-service-account.json >/dev/null 2>&1; then
            # If not valid JSON, try interpreting secret as base64-encoded JSON
            if printf '%s' "$RAW_KEY" | base64 --decode > .ci/keys/google-play-service-account.json 2>/dev/null && jq -e . .ci/keys/google-play-service-account.json >/dev/null 2>&1; then
              echo "Using base64-decoded GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            else
              echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not valid JSON (raw or base64-decoded)."
              exit 1
            fi
          fi

          if [ ! -s .ci/keys/google-play-service-account.json ]; then
            echo "Google Play service account key file was not created correctly"
            exit 1
          fi

          # Basic shape check to fail fast on wrong JSON files.
          jq -e '.type == "service_account" and .client_email and .private_key' .ci/keys/google-play-service-account.json >/dev/null

      - name: Decode Android keystore from secret
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create Android key.properties
        run: |
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          if [ -z "$KEY_ALIAS" ]; then KEY_ALIAS="upload"; fi
          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"; fi

          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify upload keystore fingerprint
        run: |
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          if [ -z "$KEY_ALIAS" ]; then KEY_ALIAS="upload"; fi
          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"; fi

          SHA1_LINE=$(keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "$KEY_PASSWORD" | grep "SHA1:")

          echo "$SHA1_LINE"

          EXPECTED_SHA1="${{ secrets.ANDROID_UPLOAD_CERT_SHA1 }}"
          if [ -n "$EXPECTED_SHA1" ]; then
            NORMALIZED_ACTUAL=$(echo "$SHA1_LINE" | sed -E 's/.*SHA1:[[:space:]]*//' | tr '[:lower:]' '[:upper:]')
            NORMALIZED_EXPECTED=$(echo "$EXPECTED_SHA1" | tr '[:lower:]' '[:upper:]')
            if [ "$NORMALIZED_ACTUAL" != "$NORMALIZED_EXPECTED" ]; then
              echo "Keystore SHA1 mismatch."
              echo "Actual:   $NORMALIZED_ACTUAL"
              echo "Expected: $NORMALIZED_EXPECTED"
              exit 1
            fi
          fi

      - name: Set Android version code
        run: |
          BASE_VERSION_CODE=$(git show -s --format=%ct HEAD)
          VERSION_CODE_OFFSET="${{ vars.RELEASE_BUILD_NUMBER_OFFSET }}"
          if [ -z "$VERSION_CODE_OFFSET" ]; then VERSION_CODE_OFFSET="${{ vars.ANDROID_VERSION_CODE_OFFSET }}"; fi
          if [ -z "$VERSION_CODE_OFFSET" ]; then VERSION_CODE_OFFSET=0; fi
          VERSION_CODE=$((BASE_VERSION_CODE + VERSION_CODE_OFFSET))
          VERSION_NAME=$(node -e "const app=require('./app.json'); process.stdout.write(app.expo.version);")
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION_NAME}+${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Using Android versionName $VERSION_NAME and versionCode $VERSION_CODE"

      - name: Build Android release artifacts
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon --parallel --build-cache

      - name: Verify Android release outputs exist
        run: |
          echo "AAB files found:"
          find android/app/build/outputs -type f -name "*.aab" -print || true
          echo "APK files found:"
          find android/app/build/outputs -type f -name "*.apk" -print || true

          AAB_COUNT=$(find android/app/build/outputs -type f -name "*.aab" | wc -l | tr -d ' ')
          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "No .aab artifact found after bundleRelease"
            exit 1
          fi

          APK_COUNT=$(find android/app/build/outputs -type f -name "*.apk" | wc -l | tr -d ' ')
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No .apk artifact found after assembleRelease"
            exit 1
          fi

      - name: Prepare signed Android APK release asset
        run: |
          mkdir -p .ci/release-assets
          APK_PATH=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | sort | head -n 1)
          cp "$APK_PATH" ".ci/release-assets/reactif-android-v${ANDROID_VERSION_NAME}+${ANDROID_VERSION_CODE}.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-apk
          path: .ci/release-assets/*.apk
          if-no-files-found: error

      - name: Generate release description txt
        run: |
          VERSION_CODE=""
          METADATA_FILE=$(find android/app/build -type f -name output-metadata.json | head -n 1 || true)
          if [ -n "$METADATA_FILE" ]; then
            VERSION_CODE=$(node -e "const fs=require('fs'); const p=process.argv[1]; const j=JSON.parse(fs.readFileSync(p,'utf8')); const e=(j.elements&&j.elements[0])||{}; process.stdout.write(String(e.versionCode||j.versionCode||''));" "$METADATA_FILE")
          fi

          METADATA_ROOT="${GITHUB_WORKSPACE}/fastlane/metadata/android"
          if [ ! -d "$METADATA_ROOT" ]; then
            echo "Google Play metadata directory not found at $METADATA_ROOT"
            exit 1
          fi

          BASE_SHA="${{ github.event.before }}"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            CHANGELOG=$(git log --no-merges --pretty=format:'- %s (%h)' "$BASE_SHA"..HEAD)
          else
            CHANGELOG=$(git log --no-merges -n 20 --pretty=format:'- %s (%h)' HEAD)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Internal CI build"
          fi

          {
            echo "Reactif CI build"
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${GITHUB_SHA::7}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Changes:"
            echo "$CHANGELOG"
          } > .ci/release-notes.txt

          while IFS= read -r LOCALE_DIR; do
            mkdir -p "$LOCALE_DIR/changelogs"
            cp .ci/release-notes.txt "$LOCALE_DIR/changelogs/default.txt"

            if [ -n "$VERSION_CODE" ]; then
              cp .ci/release-notes.txt "$LOCALE_DIR/changelogs/${VERSION_CODE}.txt"
            fi
          done < <(find "$METADATA_ROOT" -mindepth 1 -maxdepth 1 -type d | sort)

      - name: Upload release description artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-description
          path: .ci/release-notes.txt
          if-no-files-found: error

      - name: Install fastlane
        run: |
          gem install multi_json --user-install -N
          gem install fastlane --user-install -N

      - name: Upload to Google Play Internal track
        run: |
          fastlane android internal_release
        env:
          SUPPLY_TIMEOUT: 300
          PLAY_TRACK: internal
          PLAY_RELEASE_STATUS: completed
          PLAY_JSON_KEY: ${{ github.workspace }}/.ci/keys/google-play-service-account.json
          PLAY_METADATA_PATH: ${{ github.workspace }}/fastlane/metadata/android

      - name: Create Android GitHub release with signed APK
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" .ci/release-assets/*.apk --clobber
          elif ! gh release create "$RELEASE_TAG" \
            .ci/release-assets/*.apk \
            --target "$GITHUB_SHA" \
            --title "Reactif v${ANDROID_VERSION_NAME} (${ANDROID_VERSION_CODE})" \
            --notes-file .ci/release-notes.txt; then
            gh release upload "$RELEASE_TAG" .ci/release-assets/*.apk --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
